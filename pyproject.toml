[project]
name = "emporio"
version = "0.1.0"
description = "Agente de atendimento do Empório da Música (desafio técnico AI Engineer)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "holidays>=0.109",
    "python-dateutil>=2.9.0.post0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20261122",
    "types-python-dateutil>=2.9.0.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["emporio"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["emporio.domain.*", "emporio.tools.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
